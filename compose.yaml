# Local run: the app and PostgreSQL 16.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The app creates the schema on start (Flyway). To fill it with simulated
# boards from the host, once the app is up:
#
#   npm ci --prefix tools/generator
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/boot_inspection \
#     npm run generate --prefix tools/generator -- --boards 300000 --days 30

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: boot_inspection
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boot_inspection"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: boot-inspection:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/boot_inspection
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_TIMEZONE: America/Chicago
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
